<header><div><div id="brand">FIELD <span>/</span> BOARD</div><div id="subtitle" data-j="subtitle"></div></div><div class="header-right"><span class="badge" id="save-indicator"><i class="status-dot"></i><span data-j="local"></span></span><button id="photo-btn" data-j="compare"></button><button id="help-btn">?</button><button id="share-btn" class="primary" data-j="export"></button></div></header>

function drawCompare(){const c=$('compareCanvas'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=r.width*dpr;c.height=r.height*dpr;const q=c.getContext('2d');q.clearRect(0,0,c.width,c.height);if(!photoReady){q.fillStyle='#a8bfc8';q.font='16px sans-serif';q.fillText('Source image not included.',20,35);return;}const sc=Math.min(c.width/MAP_W,c.height/MAP_H),ox=(c.width-MAP_W*sc)/2,oy=(c.height-MAP_H*sc)/2;q.drawImage(photoImage,ox,oy,MAP_W*sc,MAP_H*sc);if(!$('trace-toggle').checked)return;q.save();q.translate(ox,oy);q.scale(sc,sc);q.strokeStyle='#abffcb';q.lineWidth=2.6/sc;q.setLineDash([6/sc,4/sc]);for(const o of state.obstacles)for(const s of o.segments){q.beginPath();q.moveTo(...s.a);q.lineTo(...s.b);q.stroke();}q.setLineDash([]);q.strokeStyle='white';q.lineWidth=1.5/sc;for(const o of state.obstacles)for(const s of o.segments)for(const t of s.wins){q.beginPath();q.arc(s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t,5/sc,0,Math.PI*2);q.stroke();}q.restore();}
