<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101920"><title>FIELD / BOARD - 3D Tactical Map</title>
<style>

main{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#20313d 0,#0e1922 80%)}#scene,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}#scene{touch-action:none;outline:none}#overlay{pointer-events:none}.viewport-top{position:absolute;top:17px;left:20px;right:20px;display:flex;justify-content:space-between;gap:9px;pointer-events:none}.view-tabs,.floating-tools{display:flex;gap:4px;padding:5px;border-radius:10px;border:1px solid #354851;background:#131e27eb;box-shadow:0 8px 24px #0002;pointer-events:auto}.view-tabs button,.floating-tools button{font-size:11px;padding:7px 10px;background:transparent;border-color:transparent}.view-tabs button.active{color:var(--accent);background:#263e43}.floating-tools button{font-size:15px;line-height:1.1}#hud{position:absolute;right:22px;top:80px;text-align:right;pointer-events:none}#mapstats{font-size:10px;color:#93a5b1;letter-spacing:1px}#calibtag{color:var(--yellow);font-size:10px;margin-top:5px}#modepill{display:inline-block;margin-top:10px;font-size:11px;background:#17382e;color:var(--accent);padding:5px 10px;border-radius:20px;border:1px solid #2e6351}.viewport-bottom{position:absolute;bottom:18px;left:20px;right:20px;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.legend{font-size:10px;display:flex;gap:14px;flex-wrap:wrap;color:#aebcc4;padding:10px 12px;background:#111d26df;border:1px solid var(--line);border-radius:9px;max-width:650px}.legend span{display:inline-flex;align-items:center;gap:6px}.swatch{width:13px;height:8px;background:var(--red);display:inline-block;border-radius:2px}.swatch.low{background:var(--blue)}.swatch.black{background:#74818a}.swatch.window{background:transparent;border:2px solid var(--yellow)}#helpbar{font-size:10px;color:#839aa8;margin-top:8px;text-shadow:0 1px 3px #000}#minimap{width:139px;height:158px;border:1px solid var(--line);border-radius:9px;background:#111c25dd;pointer-e #deployment-dialog{width:min(620px,94vw);max-height:92dvh}#deployment-dialog h2{margin:0;font-size:18px}.deploy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.deploy-person{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#172530;border:1px solid var(--line);border-radius:9px}.deploy-person input{width:18px;height:18px}.deploy-start{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.deploy-start button{padding:12px}.deploy-start button.active{background:var(--accent);color:#11281e;border-color:var(--accent);font-weight:700}.deploy-note{font-size:11px;color:var(--muted);line-height:1.65}.start-controls{margin:11px 0 4px}.start-controls .tools{grid-template-columns:1fr 1fr}.start-controls button{padding:9px 6px}.roster-edit{width:100%;margin-top:7px}.face-hint{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:6;padding:7px 12px;border-radius:18px;background:#2b2518e8;border:1px solid #8d753c;color:#f3d987;font-size:11px;pointer-events:none;display:none}.face-hint.show{display:block}

<header><div><div id="brand">FIELD <span>/</span> BOARD</div><div id="subtitle" data-j="subtitle"></div></div><div class="header-right"><span class="badge" id="save-indicator"><i class="status-dot"></i><span data-j="local"></span></span><button id="photo-btn" data-j="compare"></button><button id="help-btn">?</button><button id="share-btn" class="primary" data-j="export"></button></div></header>
<div id="layout"><aside><nav id="tabs"><button data-tab="team" class="active" data-j="team"></button><button data-tab="terrain" data-j="terrain"></button><button data-tab="save" data-j="phases"></button></nav><div id="panel-scroll">
<section id="tab-team"><div class="sectionhead"><b data-j="squad"></b><span class="caps">SQUAD</span></div><div id="roster" class="roster"></div><div class="start-controls"><div class="tools"><button id="start-top">↑ 上スタートへ再配置</button><button id="start-bottom">↓ 下スタートへ再配置</button></div><button id="edit-roster" class="roster-edit">出撃メンバーを選ぶ</button></div><div class="row" style="margin-top:9px"><button id="add-blue" class="tiny" data-j="addblue"></button><button id="add-red" class="tiny" data-j="addred"></button></div><p class="tip" style="margin-top:9px" data-j="example"></p><div class="divider"></div><div id="piece-empty" data-j="selectpiece"></div><div id="piece-controls"><div class="sectionhead"><b data-j="selected"></b><span id="piece-id" class="caps"></span></div><input id="piece-name" maxlength="24" aria-label="Player name"><label data-j="posture"></label><div class="postures"><button id="stand-btn" data-j="stand"></button><button id="crouch-btn" data-j="crouch"></button></div><label data-j="direction"></label><div class="range-row"><input id="yaw" type="range" min="0" max="359" value="0" aria-label="Direction"><span id="yaw-value">0&deg;</span></div><div class="tools" style="margin-top:13px"><button data-mode="move" class="active" data-j="move"></button><button data-mode="face" data-j="face"></button><button data-mode="route" data-j="route"></button><button data-mode="los" data-j="los"></button></div><div class="row" style="margin-top:7px"><button id="clear-route" class="tiny" data-j="clearroute"></button><button id="delete-piece" class="tiny danger" data-j="delete"></button></div><label class="check"><input type="checkbox" id="fan-toggle" checked><span data-j="fan"></span></label><p class="tip" data-j="fantip"></p><div class="card" style="margin-top:13px"><div class="caps">PLAYER VIEW</div><button id="eye-btn" style="width:100%;margin-top:7px" data-j="eye"></button><p class="tip" style="margin-top:6px" data-j="eyetip"></p></div></div><div class="divider"></di u30a7\u30fc\u30ba\u300d\u3067\u914d\u7f6e\u3092\u4fdd\u5b58\u3001HTML\u66f8\u51fa\u3067\u914d\u7f6e\u8fbc\u307f\u306e\u30dc\u30fc\u30c9\u306b\u306a\u308a\u307e\u3059\u3002\u540c\u6642\u5171\u540c\u7de8\u96c6\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002</p><p><span class="kbd">C</span> \u59ff\u52e2 / <span class="kbd">Esc</span> \u5168\u4f53\u8996\u70b9 / <span class="kbd">Ctrl/Cmd+Z</span> \u623b\u3059 / <span class="kbd">Ctrl/Cmd+S</span> JSON\u4fdd\u5b58</p>';
function drawCompare(){const c=$('compareCanvas'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=r.width*dpr;c.height=r.height*dpr;const q=c.getContext('2d');q.clearRect(0,0,c.width,c.height);if(!photoReady){q.fillStyle='#a8bfc8';q.font='16px sans-serif';q.fillText('Source image not included.',20,35);return;}const sc=Math.min(c.width/1172,c.height/1312),ox=(c.width-1172*sc)/2,oy=(c.height-1312*sc)/2;q.drawImage(photoImage,ox,oy,1172*sc,1312*sc);if(!$('trace-toggle').checked)return;q.save();q.translate(ox,oy);q.scale(sc,sc);q.strokeStyle='#abffcb';q.lineWidth=2.6/sc;q.setLineDash([6/sc,4/sc]);for(const o of state.obstacles)for(const s of o.segments){q.beginPath();q.moveTo(...s.a);q.lineTo(...s.b);q.stroke();}q.setLineDash([]);q.strokeStyle='white';q.lineWidth=1.5/sc;for(const o of state.obstacles)for(const s of o.segments)for(const t of s.wins){q.beginPath();q.arc(s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t,5/sc,0,Math.PI*2);q.stroke();}q.restore();}
